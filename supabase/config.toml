# Einstellungen für die Supabase-CLI. Hier steht nur, was die App braucht.
#
# hp-login ist der Login selbst: Die Funktion prüft den Code aus dem persönlichen
# Link. Die JWT-Prüfung des Gateways bleibt deshalb aus. Mit eingeschalteter
# Prüfung würden Aufrufe mit einem publishable-Schlüssel (sb_publishable_…)
# abgewiesen, bevor die Funktion läuft.
[functions.hp-login]
verify_jwt = false

# hp-offer ist das offene Formular. Die Datenbank prüft den Inhalt.
[functions.hp-offer]
verify_jwt = false
